<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" fill="none" role="img" aria-label="TaxVolca logo">
  <defs>
    <linearGradient id="goldGradH" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F5D86A"/>
    </linearGradient>
    <linearGradient id="emeraldGradH" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B86A"/>
      <stop offset="100%" stop-color="#34D88A"/>
    </linearGradient>
  </defs>

  <!-- Icon (scaled to 80x80) -->
  <g transform="translate(5, 15) scale(0.8)">
    <path d="M50 6 L84 24 L84 76 L50 94 L16 76 L16 24 Z" stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.3"/>
    <path d="M50 14 L76 28 L76 72 L50 86 L24 72 L24 28 Z" stroke="currentColor" stroke-width="0.6" fill="none" opacity="0.15"/>
    <path d="M32 32 L18 26 M32 32 L18 74 M68 32 L82 26 M68 32 L82 74 M50 82 L50 94" stroke="currentColor" stroke-width="0.8" opacity="0.25"/>
    <path d="M50 32 L50 10" stroke="url(#goldGradH)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M50 84 L32 34" stroke="url(#goldGradH)" stroke-width="7" stroke-linecap="round"/>
    <path d="M50 84 L68 34" stroke="url(#goldGradH)" stroke-width="7" stroke-linecap="round"/>
    <path d="M14 60 Q50 76 86 60" stroke="url(#emeraldGradH)" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M50 94 Q64 65 50 14" stroke="url(#emeraldGradH)" stroke-width="0.6" fill="none" opacity="0.3"/>
    <circle cx="50" cy="84" r="3" fill="url(#goldGradH)"/>
    <circle cx="32" cy="34" r="2.5" fill="url(#goldGradH)"/>
    <circle cx="68" cy="34" r="2.5" fill="url(#goldGradH)"/>
    <circle cx="50" cy="10" r="2" fill="url(#goldGradH)"/>
  </g>

  <!-- TaxVolca text -->
  <text x="110" y="52" fill="currentColor" font-family="'Times New Roman', Georgia, Garamond, serif" font-size="34" font-weight="700" letter-spacing="2">TaxVolca</text>
  <text x="110" y="52" fill="url(#goldGradH)" font-family="'Times New Roman', Georgia, Garamond, serif" font-size="34" font-weight="700" letter-spacing="2" opacity="0">
    TaxVolca
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>

  <!-- Registered mark -->
  <text x="280" y="38" fill="url(#goldGradH)" font-family="'Times New Roman', Georgia, serif" font-size="14" font-weight="400">®</text>

  <!-- Tagline -->
  <text x="110" y="80" fill="currentColor" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="4" opacity="0.5">GLOBAL TAX, LEGAL &amp; BUSINESS ADVISORY</text>
</svg>
