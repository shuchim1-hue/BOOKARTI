<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background shield shape -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#f0d685"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2d4a"/>
    </linearGradient>
  </defs>

  <!-- Shield outline -->
  <path d="M100 10 L185 50 L185 100 C185 150 150 175 100 195 C50 175 15 150 15 100 L15 50 Z"
        fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Inner decorative border -->
  <path d="M100 25 L170 58 L170 98 C170 140 140 162 100 180 C60 162 30 140 30 98 L30 58 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- CA Lettering -->
  <text x="100" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="url(#goldGrad)">CA</text>

  <!-- Scale of justice icon -->
  <g transform="translate(100, 125)" stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <line x1="0" y1="-10" x2="0" y2="15"/>
    <path d="M-25 5 L0 -5 L25 5" stroke-linecap="round"/>
    <line x1="-25" y1="5" x2="-25" y2="15"/>
    <line x1="25" y1="5" x2="25" y2="15"/>
    <circle cx="-25" cy="17" r="2" fill="url(#goldGrad)"/>
    <circle cx="25" cy="17" r="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Small decorative dots -->
  <circle cx="70" cy="40" r="2" fill="url(#goldGrad)" opacity="0.6"/>
  <circle cx="130" cy="40" r="2" fill="url(#goldGrad)" opacity="0.6"/>
  <circle cx="100" cy="160" r="2" fill="url(#goldGrad)" opacity="0.6"/>
</svg>
