<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="TaxVolca icon">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F5D86A"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B86A"/>
      <stop offset="100%" stop-color="#34D88A"/>
    </linearGradient>
  </defs>

  <!-- Outer hexagon frame -->
  <path d="M50 6 L84 24 L84 76 L50 94 L16 76 L16 24 Z" stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.3"/>

  <!-- Inner hexagon frame -->
  <path d="M50 14 L76 28 L76 72 L50 86 L24 72 L24 28 Z" stroke="currentColor" stroke-width="0.6" fill="none" opacity="0.15"/>

  <!-- Connector lines: network / AI connectivity -->
  <path d="M32 32 L18 26 M32 32 L18 74 M68 32 L82 26 M68 32 L82 74 M50 82 L50 94" stroke="currentColor" stroke-width="0.8" opacity="0.25"/>

  <!-- Upward growth antenna -->
  <path d="M50 32 L50 10" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Left arm of V -->
  <path d="M50 84 L32 34" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right arm of V -->
  <path d="M50 84 L68 34" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Globe latitude arc (emerald) -->
  <path d="M14 60 Q50 76 86 60" stroke="url(#emeraldGrad)" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Globe longitude arc (emerald) -->
  <path d="M50 94 Q64 65 50 14" stroke="url(#emeraldGrad)" stroke-width="0.6" fill="none" opacity="0.3"/>

  <!-- Bottom node -->
  <circle cx="50" cy="84" r="3" fill="url(#goldGrad)"/>

  <!-- Left node -->
  <circle cx="32" cy="34" r="2.5" fill="url(#goldGrad)"/>

  <!-- Right node -->
  <circle cx="68" cy="34" r="2.5" fill="url(#goldGrad)"/>

  <!-- Top node -->
  <circle cx="50" cy="10" r="2" fill="url(#goldGrad)"/>

  <!-- Small decorative dots at hexagon vertices -->
  <circle cx="50" cy="6" r="1.2" fill="currentColor" opacity="0.2"/>
  <circle cx="84" cy="24" r="1.2" fill="currentColor" opacity="0.2"/>
  <circle cx="84" cy="76" r="1.2" fill="currentColor" opacity="0.2"/>
  <circle cx="50" cy="94" r="1.2" fill="currentColor" opacity="0.2"/>
  <circle cx="16" cy="76" r="1.2" fill="currentColor" opacity="0.2"/>
  <circle cx="16" cy="24" r="1.2" fill="currentColor" opacity="0.2"/>
</svg>
